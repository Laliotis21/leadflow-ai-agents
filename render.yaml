services:
  - type: web
    name: leadflow-ai-agents
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # PORT and RENDER_EXTERNAL_URL are injected by Render — do not set them.
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: PIPELINE_INTERVAL_MS
        value: "1800000"
      - key: KEEPALIVE_INTERVAL_MS
        value: "840000"
      - key: GOOGLE_MAPS_DAILY_LIMIT
        value: "50"
      - key: GOOGLE_MAPS_MONTHLY_LIMIT
        value: "1000"
      # Set these as SECRETS in the Render dashboard (do NOT commit real values):
      - key: API_KEY
        sync: false
      - key: UNSUBSCRIBE_SECRET
        sync: false
      # Only needed when a custom domain fronts the service; otherwise Render's
      # RENDER_EXTERNAL_URL is used automatically.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Service-role key: server-side only, bypasses RLS (see sql/rls.sql).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_DAILY_LIMIT
        sync: false
      - key: EMAIL_MONTHLY_LIMIT
        sync: false
      - key: EMAIL_TEST_REDIRECT
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: IMAP_HOST
        value: mail-gr.securemail.pro
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_TLS
        value: "true"
      - key: IMAP_USER
        value: nikos@laliotisdigital.gr
      - key: IMAP_PASS
        sync: false
